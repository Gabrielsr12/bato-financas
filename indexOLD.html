<title>Batô Finanças</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --purple-900: #2E1147;
    --purple-800: #3E1B60;
    --purple-700: #55247F;
    --purple-500: #7C3FA8;
    --yellow-400: #F5B324;
    --yellow-500: #E89B0C;
    --bg: #F3EEF9;
    --surface: #FFFFFF;
    --ink: #241536;
    --ink-soft: #7A6C90;
    --income: #2F8F5B;
    --expense: #C23B3B;
    --line: #E4DBF0;
    --font-display: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  input, select, button { font-family: var(--font-body); }
  input:focus, select:focus { outline: 2px solid var(--yellow-400); outline-offset: 1px; }
  button:focus-visible { outline: 2px solid var(--yellow-400); outline-offset: 2px; }
  button { cursor: pointer; }

  #root {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
  }

  /* Name gate */
  .name-gate {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; width: 100%;
  }
  .name-gate-card {
    background: var(--surface); border-radius: 20px; padding: 36px 26px;
    text-align: center; max-width: 320px; width: 100%;
    box-shadow: 0 4px 24px rgba(46,17,71,0.12);
  }
  .name-gate-logo { width: 88px; height: 88px; object-fit: contain; margin: 0 auto 12px; display: block; }
  .name-gate-sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 16px; font-weight: 500; }
  .name-input, .text-input, .amount-input, .select-input, .date-input {
    width: 100%; font-size: 15px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); color: var(--ink);
  }
  .name-input { margin-bottom: 14px; text-align: center; }

  .primary-btn {
    width: 100%; padding: 13px 0; border-radius: 10px; border: none;
    background: var(--yellow-400); color: var(--purple-900); font-weight: 700; font-size: 14.5px;
  }

  /* Header */
  .header {
    background: linear-gradient(160deg, var(--purple-800), var(--purple-900));
    padding: 18px 18px 16px;
    border-bottom-left-radius: 26px;
    border-bottom-right-radius: 26px;
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .logo { height: 38px; width: 38px; object-fit: contain; }
  .month-row { display: flex; align-items: center; gap: 10px; }
  .month-arrow {
    background: rgba(255,255,255,0.12); border: none; border-radius: 8px;
    width: 26px; height: 26px; font-size: 16px; color: #fff; line-height: 1;
  }
  .month-label {
    font-family: var(--font-display); font-weight: 600; font-size: 13px;
    letter-spacing: 0.03em; color: #EFE6FA; min-width: 108px; text-align: center;
  }
  .display { text-align: center; padding: 8px 0 14px; }
  .display-label { font-size: 11px; letter-spacing: 0.2em; color: #C9B3E6; font-weight: 600; }
  .display-value { font-family: var(--font-display); font-size: 36px; font-weight: 700; margin: 4px 0; }
  .display-sub-row { font-size: 13px; font-weight: 600; display: flex; justify-content: center; gap: 10px; }
  .channel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .channel-card { background: rgba(255,255,255,0.9); border-radius: 12px; padding: 9px 11px; }
  .channel-dot { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .channel-name { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
  .channel-bal { font-family: var(--font-display); font-weight: 700; font-size: 15px; }

  /* Filters */
  .filter-scroll { display: flex; gap: 8px; padding: 14px 16px 4px; overflow-x: auto; }
  .filter-chip {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 13px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); white-space: nowrap;
  }
  .filter-chip.active { background: var(--purple-700); border-color: var(--purple-700); color: #fff; }
  .tabs { display: flex; gap: 6px; padding: 8px 16px 4px; }
  .tab {
    flex: 1; background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 0; font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
  }
  .tab.active { background: var(--yellow-400); color: var(--purple-900); border-color: var(--yellow-400); }

  /* List */
  .list { flex: 1; margin: 8px 14px 96px; display: flex; flex-direction: column; gap: 8px; }
  .empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 50px 10px; line-height: 1.6; }
  .entry { display: flex; align-items: stretch; background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(46,17,71,0.06); }
  .channel-bar { width: 4px; flex-shrink: 0; }
  .entry-left { flex: 1; min-width: 0; padding: 11px 10px; display: flex; flex-direction: column; gap: 3px; }
  .entry-desc { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-meta { font-size: 11px; color: var(--ink-soft); }
  .entry-tag { font-size: 10.5px; font-weight: 600; color: var(--ink-soft); display: flex; align-items: center; margin-top: 1px; }
  .tagdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; flex-shrink: 0; }
  .entry-right { display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .entry-amount { font-family: var(--font-display); font-size: 13.5px; font-weight: 700; white-space: nowrap; }
  .delete-btn { background: none; border: none; color: var(--line); font-size: 18px; line-height: 1; padding: 2px 4px; }

  /* FAB */
  .fab {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 398px;
    background: linear-gradient(120deg, var(--yellow-400), var(--yellow-500));
    color: var(--purple-900); border: none; border-radius: 14px; padding: 15px 0;
    font-size: 15px; font-weight: 700; font-family: var(--font-display);
    box-shadow: 0 8px 18px rgba(232,155,12,0.35);
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(46,17,71,0.55);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    width: 100%; max-width: 460px; background: var(--surface);
    border-top-left-radius: 22px; border-top-right-radius: 22px;
    padding: 10px 18px 26px; display: flex; flex-direction: column; gap: 11px;
    max-height: 92vh; overflow-y: auto;
  }
  .modal-handle { width: 36px; height: 4px; background: var(--line); border-radius: 2px; margin: 6px auto 4px; }
  .type-toggle { display: flex; gap: 8px; }
  .type-btn {
    flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-soft); font-weight: 700; font-size: 13.5px;
  }
  .type-btn.active-expense { background: var(--expense); color: #fff; border-color: var(--expense); }
  .type-btn.active-income { background: var(--income); color: #fff; border-color: var(--income); }
  .amount-input {
    font-family: var(--font-display); font-size: 28px; font-weight: 700; text-align: center;
    border: none; border-bottom: 2px solid var(--line); padding: 8px 0; background: transparent;
  }
  .channel-select-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .channel-pill {
    padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff;
    color: var(--ink-soft); font-size: 12.5px; font-weight: 600;
  }
  .form-row { display: flex; gap: 8px; }
  .form-row > * { flex: 1; }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; }
  .cancel-btn {
    flex: 1; padding: 13px 0; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-soft); font-weight: 600;
  }
  .form-actions .primary-btn { flex: 2; }

  .error-banner {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 390px;
    background: var(--expense); color: #fff; font-size: 12.5px; padding: 8px 12px;
    border-radius: 8px; text-align: center; display: none; z-index: 20;
  }
  .error-banner.show { display: block; }
</style>

  var STORAGE_TX = "bato_transactions";
  var STORAGE_NAME = "bato_user_name";

  function channelOf(id) {
    for (var i = 0; i < CHANNELS.length; i++) if (CHANNELS[i].id === id) return CHANNELS[i];
    return CHANNELS[3];
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function formatBRL(n) {
    var v = Number(n) || 0;
    return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  function formatDateShort(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  }
  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  // ---- state ----
  var state = {
    transactions: [],
    userName: "",
    channelFilter: "todos",
    typeFilter: "todos",
    monthOffset: 0,
    showForm: false,
    form: { desc: "", amount: "", type: "despesa", channel: "geral", category: CATEGORIES[0], date: new Date().toISOString().slice(0, 10) }
  };

  function loadState() {
    try {
      var tx = localStorage.getItem(STORAGE_TX);
      state.transactions = tx ? JSON.parse(tx) : [];
    } catch (e) { state.transactions = []; }
    try {
      state.userName = localStorage.getItem(STORAGE_NAME) || "";
    } catch (e) { state.userName = ""; }
  }

  function saveTransactions() {
    try {
      localStorage.setItem(STORAGE_TX, JSON.stringify(state.transactions));
      return true;
    } catch (e) {
      return false;
    }
  }

  function saveName(name) {
    state.userName = name;
    try { localStorage.setItem(STORAGE_NAME, name); } catch (e) {}
    render();
  }

  function showError(msg) {
    var el = document.getElementById("error-banner");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(function () { el.classList.remove("show"); }, 3000);
  }

  function getTargetDate() {
    var d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + state.monthOffset);
    return d;
  }

  function getMonthTx() {
    var d = getTargetDate();
    var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    return state.transactions.filter(function (t) { return t.date.indexOf(key) === 0; });
  }

  function getTotals(list) {
    var income = 0, expense = 0;
    list.forEach(function (t) {
      if (t.type === "receita") income += Number(t.amount); else expense += Number(t.amount);
    });
    return { income: income, expense: expense, balance: income - expense };
  }

  function getByChannel(list) {
    var map = {};
    CHANNELS.forEach(function (c) { map[c.id] = { income: 0, expense: 0 }; });
    list.forEach(function (t) {
      if (!map[t.channel]) map[t.channel] = { income: 0, expense: 0 };
      if (t.type === "receita") map[t.channel].income += Number(t.amount);
      else map[t.channel].expense += Number(t.amount);
    });
    return map;
  }

  function addTransaction() {
    var f = state.form;
    if (!f.desc.trim() || !f.amount || Number(f.amount) <= 0) {
      showError("Preenche a descrição e um valor válido.");
      return;
    }
    var entry = {
      id: uid(), desc: f.desc.trim(), amount: Number(f.amount), type: f.type,
      channel: f.channel, category: f.category, date: f.date, person: state.userName || "Alguém"
    };
    state.transactions.unshift(entry);
    if (!saveTransactions()) showError("Não consegui salvar. O armazenamento do navegador pode estar cheio.");
    state.form = { desc: "", amount: "", type: "despesa", channel: "geral", category: CATEGORIES[0], date: new Date().toISOString().slice(0, 10) };
    state.showForm = false;
    render();
  }

  function deleteTransaction(id) {
    state.transactions = state.transactions.filter(function (t) { return t.id !== id; });
    if (!saveTransactions()) showError("Não consegui salvar a exclusão.");
    render();
  }

  // ---- render ----
  function render() {
    var root = document.getElementById("root");

    if (!state.userName) {
      root.innerHTML =
        '<div class="name-gate"><div class="name-gate-card">' +
        '<img src="' + LOGO_SRC + '" alt="Batô" class="name-gate-logo" />' +
        '<p class="name-gate-sub">Quem está lançando hoje?</p>' +
        '<input id="name-input" class="name-input" placeholder="Seu nome" />' +
        '<button id="name-submit" class="primary-btn">Entrar</button>' +
        '</div></div>';
      document.getElementById("name-submit").onclick = function () {
        var v = document.getElementById("name-input").value.trim();
        if (v) saveName(v);
      };
      document.getElementById("name-input").onkeydown = function (e) {
        if (e.key === "Enter") {
          var v = e.target.value.trim();
          if (v) saveName(v);
        }
      };
      document.getElementById("name-input").focus();
      return;
    }

    var targetDate = getTargetDate();
    var monthLabel = MONTHS_PT[targetDate.getMonth()] + " " + targetDate.getFullYear();
    var monthTx = getMonthTx();
    var totals = getTotals(monthTx);
    var byChannel = getByChannel(monthTx);

    var filtered = monthTx.slice();
    if (state.channelFilter !== "todos") filtered = filtered.filter(function (t) { return t.channel === state.channelFilter; });
    if (state.typeFilter !== "todos") filtered = filtered.filter(function (t) { return t.type === state.typeFilter; });
    filtered.sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var html = '';

    // header
    html += '<div class="header">';
    html += '<div class="top-row"><img src="' + LOGO_SRC + '" class="logo" alt="Batô" />';
    html += '<div class="month-row"><button class="month-arrow" id="prev-month">‹</button>';
    html += '<div class="month-label">' + monthLabel + '</div>';
    html += '<button class="month-arrow" id="next-month" style="opacity:' + (state.monthOffset >= 0 ? '0.3' : '1') + '">›</button></div></div>';

    html += '<div class="display"><div class="display-label">SALDO DO MÊS</div>';
    html += '<div class="display-value" style="color:' + (totals.balance >= 0 ? '#FFE28A' : '#FFB4A8') + '">' + formatBRL(totals.balance) + '</div>';
    html += '<div class="display-sub-row"><span style="color:#B8F5C4">+' + formatBRL(totals.income) + '</span>';
    html += '<span style="opacity:0.4">│</span><span style="color:#FFC9C0">−' + formatBRL(totals.expense) + '</span></div></div>';

    html += '<div class="channel-grid">';
    CHANNELS.forEach(function (c) {
      var d = byChannel[c.id] || { income: 0, expense: 0 };
      var bal = d.income - d.expense;
      html += '<div class="channel-card"><div class="channel-dot"><span class="dot" style="background:' + c.color + '"></span>';
      html += '<span class="channel-name">' + c.label + '</span></div>';
      html += '<div class="channel-bal" style="color:' + (bal >= 0 ? 'var(--purple-700)' : 'var(--expense)') + '">' + formatBRL(bal) + '</div></div>';
    });
    html += '</div></div>';

    // filters
    html += '<div class="filter-scroll">';
    html += '<button class="filter-chip' + (state.channelFilter === 'todos' ? ' active' : '') + '" data-channel="todos">Todos os canais</button>';
    CHANNELS.forEach(function (c) {
      var active = state.channelFilter === c.id;
      html += '<button class="filter-chip' + (active ? ' active' : '') + '" data-channel="' + c.id + '" style="' + (active ? 'background:' + c.color + ';border-color:' + c.color : '') + '">' + c.label + '</button>';
    });
    html += '</div>';

    html += '<div class="tabs">';
    [["todos", "Todos"], ["receita", "Receitas"], ["despesa", "Despesas"]].forEach(function (pair) {
      html += '<button class="tab' + (state.typeFilter === pair[0] ? ' active' : '') + '" data-type="' + pair[0] + '">' + pair[1] + '</button>';
    });
    html += '</div>';

    // list
    html += '<div class="list">';
    if (filtered.length === 0) {
      html += '<div class="empty">Nada lançado em ' + monthLabel.toLowerCase() + ' ainda.<br />Toque em “+ Lançar” pra começar.</div>';
    }
    filtered.forEach(function (t) {
      var ch = channelOf(t.channel);
      html += '<div class="entry"><div class="channel-bar" style="background:' + ch.color + '"></div>';
      html += '<div class="entry-left"><div class="entry-desc">' + escapeHtml(t.desc) + '</div>';
      html += '<div class="entry-meta">' + formatDateShort(t.date) + ' · ' + escapeHtml(t.category) + ' · ' + escapeHtml(t.person) + '</div>';
      html += '<div class="entry-tag"><span class="tagdot" style="background:' + ch.color + '"></span>' + ch.label + '</div></div>';
      html += '<div class="entry-right"><div class="entry-amount" style="color:' + (t.type === 'receita' ? 'var(--income)' : 'var(--expense)') + '">' + (t.type === 'receita' ? '+' : '−') + formatBRL(t.amount) + '</div>';
      html += '<button class="delete-btn" data-delete="' + t.id + '">×</button></div></div>';
    });
    html += '</div>';

    // fab
    html += '<button class="fab" id="open-form">+ Lançar</button>';

    // modal
    var f = state.form;
    html += '<div class="modal-overlay' + (state.showForm ? ' open' : '') + '" id="modal-overlay">';
    html += '<div class="modal" id="modal-box"><div class="modal-handle"></div>';
    html += '<div class="type-toggle">';
    html += '<button class="type-btn' + (f.type === 'despesa' ? ' active-expense' : '') + '" data-formtype="despesa">Despesa</button>';
    html += '<button class="type-btn' + (f.type === 'receita' ? ' active-income' : '') + '" data-formtype="receita">Receita</button>';
    html += '</div>';
    html += '<input id="form-amount" class="amount-input" placeholder="R$ 0,00" inputmode="decimal" value="' + f.amount + '" />';
    html += '<input id="form-desc" class="text-input" placeholder="Descrição (ex: Pedido #182)" value="' + escapeHtml(f.desc) + '" />';
    html += '<div class="channel-select-row">';
    CHANNELS.forEach(function (c) {
      var active = f.channel === c.id;
      html += '<button class="channel-pill" data-formchannel="' + c.id + '" style="' + (active ? 'background:' + c.color + ';color:#fff;border-color:' + c.color : '') + '">' + c.label + '</button>';
    });
    html += '</div>';
    html += '<div class="form-row"><select id="form-category" class="select-input">';
    CATEGORIES.forEach(function (c) {
      html += '<option value="' + c + '"' + (f.category === c ? ' selected' : '') + '>' + c + '</option>';
    });
    html += '</select><input id="form-date" type="date" class="date-input" value="' + f.date + '" /></div>';
    html += '<div class="form-actions"><button class="cancel-btn" id="form-cancel">Cancelar</button>';
    html += '<button class="primary-btn" id="form-submit">Lançar</button></div>';
    html += '</div></div>';

    html += '<div class="error-banner" id="error-banner"></div>';

    root.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers() {
    var prevBtn = document.getElementById("prev-month");
    var nextBtn = document.getElementById("next-month");
    if (prevBtn) prevBtn.onclick = function () { state.monthOffset -= 1; render(); };
    if (nextBtn) nextBtn.onclick = function () { if (state.monthOffset < 0) { state.monthOffset += 1; render(); } };

    document.querySelectorAll("[data-channel]").forEach(function (btn) {
      btn.onclick = function () { state.channelFilter = btn.getAttribute("data-channel"); render(); };
    });
    document.querySelectorAll("[data-type]").forEach(function (btn) {
      btn.onclick = function () { state.typeFilter = btn.getAttribute("data-type"); render(); };
    });
    document.querySelectorAll("[data-delete]").forEach(function (btn) {
      btn.onclick = function () { deleteTransaction(btn.getAttribute("data-delete")); };
    });

    var openForm = document.getElementById("open-form");
    if (openForm) openForm.onclick = function () { state.showForm = true; render(); setTimeout(function () { var el = document.getElementById("form-amount"); if (el) el.focus(); }, 0); };

    var overlay = document.getElementById("modal-overlay");
    var box = document.getElementById("modal-box");
    if (overlay) overlay.onclick = function (e) { if (e.target === overlay) { state.showForm = false; render(); } };
    if (box) box.onclick = function (e) { e.stopPropagation(); };

    var cancelBtn = document.getElementById("form-cancel");
    if (cancelBtn) cancelBtn.onclick = function () { state.showForm = false; render(); };

    var submitBtn = document.getElementById("form-submit");
    if (submitBtn) submitBtn.onclick = addTransaction;

    document.querySelectorAll("[data-formtype]").forEach(function (btn) {
      btn.onclick = function () { state.form.type = btn.getAttribute("data-formtype"); render(); focusModal(); };
    });
    document.querySelectorAll("[data-formchannel]").forEach(function (btn) {
      btn.onclick = function () { state.form.channel = btn.getAttribute("data-formchannel"); render(); focusModal(); };
    });

    var amountInput = document.getElementById("form-amount");
    if (amountInput) amountInput.oninput = function (e) {
      state.form.amount = e.target.value.replace(",", ".").replace(/[^0-9.]/g, "");
    };
    var descInput = document.getElementById("form-desc");
    if (descInput) descInput.oninput = function (e) { state.form.desc = e.target.value; };
    var categorySelect = document.getElementById("form-category");
    if (categorySelect) categorySelect.onchange = function (e) { state.form.category = e.target.value; };
    var dateInput = document.getElementById("form-date");
    if (dateInput) dateInput.onchange = function (e) { state.form.date = e.target.value; };
  }

  function focusModal() {
    // keep modal open state consistent after re-render triggered by pill clicks
    state.showForm = true;
  }

  loadState();
  render();
})();
</script>
</body>
</html>
